openapi: 3.1.0
info:
  title: Kusi Kusi API
  version: 0.1.0
  description: Multi-tenant integration API and loopback-only local product workspace. Local mutations require role authorization and CSRF; no external publication occurs in local mode. Verified channel bindings can opt into registered adaptive loopback GraphQL reads; message text cannot select identity, credentials or destinations.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/auth/mode:
    get:
      summary: Report whether the server runs the local workspace or admin control plane
      security: []
      responses:
        '200': {description: Mode and OIDC availability; no-store}
  /v1/admin/auth/oidc/start:
    get:
      summary: Start configured admin OIDC authorization
      description: Admin control plane only. Uses server-generated state, nonce and PKCE; redirects only to the configured issuer. The fixed Next proxy preserves Location and Set-Cookie without following upstream redirects.
      security: []
      responses:
        '307': {description: Redirect to the configured identity provider; sets short-lived HttpOnly transaction cookie}
        '404': {description: OIDC is unavailable in local mode}
        '503': {description: OIDC is not configured or unavailable}
  /v1/admin/auth/oidc/callback:
    get:
      summary: Complete the one-use admin OIDC transaction
      description: Callback failures redirect to /admin?error=login_failed. Identity must already be provisioned.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: iss, in: query, schema: {type: string}}
      responses:
        '307': {description: Redirect to /admin; success sets an HttpOnly admin session cookie}
  /v1/admin/auth/session:
    get:
      summary: Get current provisioned admin memberships and CSRF token
      security: [{AdminSession: []}]
      responses:
        '200':
          description: Active memberships, CSRF token and session expiry; no-store
          content:
            application/json:
              schema:
                type: object
                required: [memberships, csrf_token, expires_at]
                properties:
                  memberships: {type: array, items: {type: object}}
                  csrf_token: {type: string}
                  expires_at: {type: integer}
        '401': {description: Missing, expired or revoked session}
  /v1/admin/auth/logout:
    post:
      summary: Revoke the current admin session
      security: [{AdminSession: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      responses:
        '204': {description: Session revoked and cookie cleared}
        '403': {description: Origin or CSRF validation failed}
  /local/auth/login:
    post:
      summary: Start an eight-hour HttpOnly local session
      security: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - organization
              - username
              - password
              properties:
                organization: &id001
                  type: string
                username: *id001
                password:
                  type: string
                  format: password
  /local/auth/session:
    get:
      summary: Get current local identity and CSRF token
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
  /local/auth/logout:
    post:
      summary: Revoke session and clear cookie
      security:
      - LocalSession: []
      responses:
        '204':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema:
          type: string
  /v1/local/bootstrap:
    post:
      summary: 'Headless admin plus tenant key: create first local owner'
      security:
      - AdminKey: []
        TenantBearer: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - display_name
              - password
              properties:
                username: *id001
                display_name: *id001
                password: *id001
  /v1/local/overview:
    get:
      summary: List tenant-scoped overview
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
  /v1/demo/payments:
    get:
      summary: List the fixed synthetic payment records for the local no-login demo
      description: Available only when local mode is enabled and loopback-only. Contains no real student identity or payment data.
      responses:
        '200': {description: Payments returned by the local payment-platform clone; each payment includes voucher_use (available, used, review_required), independently of payment_state}
        '404': {description: Local demo mode is disabled}
  /v1/demo/payments/by-dni:
    post:
      summary: Demonstrate payment-history lookup with the fixed synthetic DNI
      description: Loopback-only demo accepts DNI 70000001 (payments) and 70000002 (empty payment history) and returns a masked synthetic identity; unknown DNI returns 404. This is not authentication and must never be used for real student records.
      parameters:
      - {name: Origin, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dni]
              properties: {dni: {type: string, pattern: '^[0-9]{8}$'}}
      responses:
        '200': {description: Synthetic student identity with masked DNI and payment history}
        '400': {description: Malformed DNI}
        '403': {description: Origin mismatch}
        '404': {description: DNI not present in the synthetic clone or local demo disabled}
  /v1/demo/payments/validate:
    post:
      summary: Validate a payment or receipt code against the local platform clone
      description: Read-only lookup of synthetic records. Requires same-origin browser request; no credentials or student identifier are accepted.
      parameters:
      - {name: Origin, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties: {code: {type: string, minLength: 1, maxLength: 40}}
      responses:
        '200': {description: Matching synthetic payment record}
        '400': {description: Invalid code}
        '403': {description: Origin mismatch}
        '404': {description: Code not present in the clone}
  /v1/demo/payments/validate-receipt:
    post:
      summary: OCR a receipt photo locally and validate its reference in the platform clone
      description: Loopback-only demo. Accepts PNG, JPEG or WebP up to 5 MiB; OCR runs locally in memory. The photo and full OCR text are not persisted or returned.
      parameters:
      - {name: Origin, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200': {description: Detected synthetic reference matched to a payment record}
        '400': {description: Invalid or oversized image}
        '403': {description: Origin mismatch}
        '404': {description: Receipt reference not found in the clone}
        '415': {description: Unsupported media type}
        '422': {description: No receipt reference detected}
  /v1/local/cases:
    get:
      summary: List synthetic cases accessible to the authenticated local user
      security: [{LocalSession: []}]
      responses:
        '200': {description: Tenant scoped cases for requester or assigned staff}
        '401': {description: Local authentication required}
  /v1/local/cases/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read a tenant scoped case and its attributed history
      security: [{LocalSession: []}]
      responses:
        '200': {description: Synthetic case with masked payment reference}
        '403': {description: User is not the requester or assigned staff}
        '404': {description: Case not found in authenticated tenant}
  /v1/local/cases/{id}/sources:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: List source excerpts and version status for the case
      security: [{LocalSession: []}]
      responses:
        '200': {description: Sources include official URL, page and validity status}
        '404': {description: Case not found in authenticated tenant}
  /v1/local/cases/{id}/guidance:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Build source grounded guidance using deterministic demo or configured loopback model
      description: No tools, paid providers, external sends or decisions. Payment validity remains for UNCP confirmation.
      security: [{LocalSession: []}]
      parameters:
      - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties: {question: {type: string, minLength: 1, maxLength: 1200}}
      responses:
        '200': {description: Guidance with citations and explicit source status}
        '403': {description: Role or CSRF denied}
  /v1/local/cases/{id}/requests:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Create or revise the request draft for the case requester
      security: [{LocalSession: []}]
      parameters:
      - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient_unit, body, include_receipt_fixture]
              properties:
                recipient_unit: {type: string, minLength: 1, maxLength: 120}
                body: {type: string, minLength: 1, maxLength: 4000}
                include_receipt_fixture: {type: boolean}
      responses:
        '200': {description: Versioned private draft; edits revoke prior consent}
        '403': {description: Requester or CSRF check failed}
  /v1/local/cases/{id}/requests/{request_id}/approve:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Approve the exact draft version and record explicit sharing consent
      security: [{LocalSession: []}]
      parameters:
      - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, digest, confirm_share]
              properties:
                version: {type: integer, minimum: 1}
                digest: {type: string, minLength: 64, maxLength: 64}
                confirm_share: {type: boolean, const: true}
      responses:
        '200': {description: Approved version and consent record}
        '409': {description: Draft version or digest changed}
  /v1/local/cases/{id}/requests/{request_id}/simulate-send:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Record a local simulated send after consent
      description: Does not contact ADESA, email, channels or any external service.
      security: [{LocalSession: []}]
      parameters:
      - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Idempotent local simulation receipt}
        '403': {description: No active consent for this version}
  /v1/local/cases/{id}/responses:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Record an attributed staff response on an assigned case
      security: [{LocalSession: []}]
      parameters:
      - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [response_type, body, citation_keys]
              properties:
                response_type: {type: string, enum: [request_information, guidance, referral, institutional_decision]}
                body: {type: string, minLength: 1, maxLength: 4000}
                citation_keys: {type: array, maxItems: 8, items: {type: string}}
      responses:
        '200': {description: Response attributed to authenticated staff user}
        '403': {description: Assigned approver role required}
  /v1/local/activity:
    get:
      summary: List tenant-scoped activity
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
  /v1/local/connection-settings:
    get:
      summary: List owner-managed Plane, Frappe and Telegram configuration
      description: Loopback workspace only. Tenant and actor come from the verified local session. Owner-only response contains public metadata and credential field names, never ciphertext or credential values. Saved profiles are not active runtime configuration.
      security: [{LocalSession: []}]
      responses:
        '200':
          description: Private no-store list of configuration summaries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ManagedConnectionSummary'}
        '401': {description: "Missing or revoked session"}
        '403': {description: "Owner role required"}
        '503': {description: "Storage unavailable"}
  /v1/local/connection-settings/{kind}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [plane, frappe, telegram]}}
    put:
      summary: Save or rotate a private connection configuration
      description: Owner and CSRF required; a supplied Origin must match the workspace. Secrets are write-only, encrypted with tenant/profile/kind/revision AAD and never echoed, including malformed input errors. Empty or omitted credential fields retain existing values. Telegram gets a server-generated webhook secret when first saving a bot token without one. expected_revision must be null/omitted for creation and match the current revision for editing. Saving does not test credentials, activate runtime adapters, register webhooks or send messages. Input limit 32 KiB.
      security: [{LocalSession: []}]
      parameters:
        - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagedConnectionInput'}
      responses:
        '200':
          description: Configuration saved and audited atomically; secret-free no-store summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedConnectionSummary'}
        '400': {description: "Invalid endpoint, adapter or credential format"}
        '401': {description: "Session required"}
        '403': {description: "Owner role, same Origin or CSRF check failed"}
        '409': {description: "Revision conflict; reload before editing"}
        '413': {description: "Request exceeds body limit"}
        '422': {description: "Malformed or unknown fields; generic response without submitted values"}
        '503': {description: "Storage or credential decryption unavailable; no update committed"}
  /v1/local/connection-settings/{kind}/credentials:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [plane, frappe, telegram]}}
    delete:
      summary: Explicitly clear saved credentials while retaining public metadata
      description: Owner and CSRF required. A supplied Origin must match the workspace. Removes encrypted credentials, increments revision and audits in one transaction. Does not revoke a token at the provider or modify active legacy channels.
      security: [{LocalSession: []}]
      parameters:
        - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Secret-free summary with no credentials present
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedConnectionSummary'}
        '401': {description: "Session required"}
        '403': {description: "Owner role, Origin or CSRF check failed"}
        '409': {description: "Missing profile or revision conflict"}
        '422': {description: "Malformed input without echoed values"}
        '503': {description: "Storage unavailable"}
  /v1/local/settings:
    get:
      summary: List tenant-scoped settings
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
  /v1/local/sessions:
    get:
      summary: List active local sessions visible to the authenticated account
      description: Users see only their sessions; owners see only sessions in their organization. Returns management IDs and dates, never credentials or transport metadata.
      security:
      - LocalSession: []
      responses:
        '200':
          description: Active sessions with current-session marker
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, user_id, display_name, username, created_at, expires_at, current]
                      properties:
                        id: {type: string, format: uuid}
                        user_id: {type: string, format: uuid}
                        display_name: *id001
                        username: *id001
                        created_at: {type: integer, format: int64}
                        expires_at: {type: integer, format: int64}
                        current: {type: boolean}
        '401': {description: Local authentication required}
        '503': {description: Session store unavailable}
  /v1/local/sessions/{id}:
    delete:
      summary: Revoke one older local session
      description: Users may revoke their own other sessions; owners may revoke another session in the same organization. The current session must use logout.
      security:
      - LocalSession: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: x-csrf-token, in: header, required: true, schema: {type: string}}
      responses:
        '204': {description: Session and linked credential revoked atomically}
        '401': {description: Local authentication required}
        '403': {description: CSRF, Origin, or role denied}
        '404': {description: Active session not found in permitted scope}
        '409': {description: Current session must be ended through logout}
        '503': {description: Session store unavailable; no partial success}
  /v1/local/users:
    get:
      summary: List tenant-scoped users
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
    post:
      summary: Create organization user (owner only)
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - display_name
              - password
              - role
              properties:
                username: *id001
                display_name: *id001
                password: *id001
                role: &id003
                  type: string
                  enum:
                  - owner
                  - editor
                  - approver
                  - viewer
  /v1/local/assets:
    get:
      summary: List tenant-scoped assets
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
    post:
      summary: Upload validated image/video (max 10 MiB)
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema:
          type: string
      - name: filename
        in: query
        required: true
        schema:
          type: string
      - name: label
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /v1/local/conversations:
    get:
      summary: List tenant-scoped conversations
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
    post:
      summary: Create local conversation
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - title
              properties:
                title: *id001
  /v1/local/publications:
    get:
      summary: List tenant-scoped publications
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
    post:
      summary: Create simulated publication draft
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Local authentication required
        '403':
          description: Role or CSRF denied
        '404':
          description: Tenant-scoped resource not found
        '409':
          description: State changed, expired approval, or conflicting idempotency key
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: &id004
              type: object
              additionalProperties: false
              required:
              - asset_id
              - platform
              - caption
              - privacy
              - scheduled_at
              - idempotency_key
              properties:
                asset_id: &id002
                  type: string
                  format: uuid
                platform:
                  type: string
                  enum:
                  - instagram
                  - facebook
                  - tiktok
                caption: *id001
                privacy:
                  type: string
                  enum:
                  - private
