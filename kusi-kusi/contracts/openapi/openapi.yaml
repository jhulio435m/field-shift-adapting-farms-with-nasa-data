        '403':
          description: Role, Origin/CSRF denied or local external operation blocked
        '404':
          description: Resource absent or inaccessible
        '409':
          description: Revision changed, expired, unreviewable or uncertain effect
        '422':
          description: Malformed lifecycle JSON without echoed values
        '429':
          description: Rate limited
        '503':
          description: Storage unavailable
    put:
      summary: Set own consent; opting out erases retained memory payload
      description: Authenticated actor; current ownership and permissions required.
        Local workspace only; no-store; never activates providers. Organization comes
        from the session.
      security:
      - LocalSession: []
      responses:
        '204':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Session required
        '403':
          description: Role, Origin/CSRF denied or local external operation blocked
        '404':
          description: Resource absent or inaccessible
        '409':
          description: Revision changed, expired, unreviewable or uncertain effect
        '422':
          description: Malformed lifecycle JSON without echoed values
        '429':
          description: Rate limited
        '503':
          description: Storage unavailable
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema: *mi_path002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedMemoryPreference'
  /v1/local/authorized-memories/{id}:
    delete:
      summary: Erase own memory payload and exclude it from recovery
      description: Authenticated actor; current ownership and permissions required.
        Local workspace only; no-store; never activates providers. Organization comes
        from the session.
      security:
      - LocalSession: []
      responses:
        '204':
          description: Successful local operation
        '400':
          description: Invalid input
        '401':
          description: Session required
        '403':
          description: Role, Origin/CSRF denied or local external operation blocked
        '404':
          description: Resource absent or inaccessible
        '409':
          description: Revision changed, expired, unreviewable or uncertain effect
        '422':
          description: Malformed lifecycle JSON without echoed values
        '429':
          description: Rate limited
        '503':
          description: Storage unavailable
      parameters:
      - *mi_path005
      - name: x-csrf-token
        in: header
        required: true
        schema: *mi_path002
  /v1/local/policy-simulations:
    post:
      summary: Simulate current demonstration resource permission without grants mutation
      description: Owner only. Local workspace only; no-store; never activates providers.
        Organization comes from the session.
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySimulationDecision'
        '400':
          description: Invalid input
        '401':
          description: Session required
        '403':
          description: Role, Origin/CSRF denied or local external operation blocked
        '404':
          description: Resource absent or inaccessible
        '409':
          description: Revision changed, expired, unreviewable or uncertain effect
        '422':
          description: Malformed lifecycle JSON without echoed values
        '429':
          description: Rate limited
        '503':
          description: Storage unavailable
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema: *mi_path002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySimulationInput'
  /v1/local/managed-queries:
    post:
      summary: Execute a typed synthetic read using saved profile and 007 ACL
      description: Fixture only. Requires a current simulated profile verification,
        active session principal, registered capability, capability permission, verified
        external identity link and exact resource grant. Never calls a provider or lets
        a caller select organization or transport. The fixture dataset only exposes
        fixture-a. Reauthorization occurs before reading and before returning evidence.
      security:
      - LocalSession: []
      responses:
        '200':
          description: Successful local operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFixtureQueryResult'
        '400':
          description: Invalid input
        '401':
          description: Session required
        '403':
          description: Role, Origin/CSRF denied or local external operation blocked
        '404':
          description: Resource absent or inaccessible
        '409':
          description: Revision changed, expired, unreviewable or uncertain effect
        '422':
          description: Malformed lifecycle JSON without echoed values
        '429':
          description: Rate limited
        '503':
          description: Storage unavailable
      parameters:
      - name: x-csrf-token
        in: header
        required: true
        schema: *mi_path002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedFixtureQueryInput'
  /v1/local/managed-executions/{id}/proposal:
    get:
      summary: Read the exact local proposal before approval
      description: Only the owning actor with owner/approver role. Requires awaiting_review and current registered binding for channel destinations. Provider-linked proposals are not reviewable through this local contract. Returns private content and destination solely for this necessary review; never in list or timeline.
      security: [{LocalSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Private exact snapshot; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedExecutionProposal'}
        '401': {description: Session required}
        '403': {description: Role denied}
        '404': {description: Absent, inaccessible or unreviewable proposal}
        '503': {description: Storage unavailable}
components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: cookie
      name: kusi_local_session
      description: Local loopback mode only. Mutations also require x-csrf-token from session endpoint.

    AdminSession:
      type: apiKey
      in: cookie
      name: kusi_admin_session
      description: Production admin control plane only. Logout mutations require same-origin Origin and x-csrf-token.

    AdminKey:
      type: apiKey
      in: header
      name: x-admin-key
    TenantBearer:
      type: http
      scheme: bearer

  schemas:
    ManagedConnectionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 2, maxLength: 120, description: "Public connection label; at most 120 UTF-8 bytes"}
        base_url: {type: [string, 'null'], maxLength: 2048, description: "Required HTTPS origin for Plane/Frappe; no path, userinfo, query, fragment or IP host. Must be null/omitted for Telegram. Syntax validation does not verify DNS or provider connectivity."}
        workspace: {type: [string, 'null'], maxLength: 120, description: "Optional Plane workspace slug; null/omitted for other kinds"}
        bot_username: {type: [string, 'null'], maxLength: 32, description: "Optional Telegram bot username without @; null/omitted for other kinds"}
        webhook_url: {type: [string, 'null'], maxLength: 2048, description: "Optional HTTPS webhook URL for Telegram; stored without registering it"}
        expected_revision: {type: [integer, 'null'], minimum: 1}
        credentials:
          type: object
          additionalProperties: false
          writeOnly: true
          description: Omitted or empty fields retain stored values. Only fields appropriate to the selected kind are accepted.
          properties:
            api_key: {type: string, maxLength: 4096, writeOnly: true, description: "Plane API key or Frappe API Key"}
            api_secret: {type: string, maxLength: 4096, writeOnly: true, description: "Frappe API Secret"}
            bot_token: {type: string, maxLength: 277, writeOnly: true, description: "Telegram bot token; numeric prefix and opaque secret"}
            webhook_secret: {type: string, maxLength: 256, anyOf: [{maxLength: 0}, {minLength: 16}], writeOnly: true, description: "Telegram webhook secret; empty preserves existing value"}
    ManagedConnectionSummary:
      type: object
      additionalProperties: false
      required: [kind, label, base_url, workspace, bot_username, webhook_url, revision, credential_fields, configured, runtime_active, verification]
      properties:
        kind: {type: string, enum: [plane, frappe, telegram]}
        label: {type: string}
        base_url: {type: [string, 'null']}
        workspace: {type: [string, 'null']}
        bot_username: {type: [string, 'null']}
        webhook_url: {type: [string, 'null']}
        revision: {type: integer, minimum: 1}
        credential_fields: {type: array, items: {type: string, enum: [api_key, api_secret, bot_token, webhook_secret]}, description: "Field names only; never values"}
        configured: {type: boolean, description: "Required credential fields are present; not proof of authentication"}
        runtime_active: {type: boolean, const: false}
        verification: {type: string, const: not_verified}
    ConnectionVerification:
      type: object
      additionalProperties: false
      required:
      - id
      - profile_revision
      - adapter_version
      - mode
      - status
      - checked_at
      - expires_at
      - scope_summary
      - error_code
      - runtime_active
      properties:
        id: &mi_schema003
          type:
          - string
          - 'null'
          format: uuid
        profile_revision: &mi_schema002
          type: integer
          minimum: 1
        adapter_version: &mi_schema001
          type: string
        mode:
          type:
          - string
          - 'null'
          enum:
          - fixture
          - provider
          - null
        status:
          type: string
          enum:
          - not_verified
          - pending
          - verified
          - failed
          - stale
        checked_at:
          type:
          - integer
          - 'null'
        expires_at:
          type:
          - integer
          - 'null'
        scope_summary: *mi_schema001
        error_code: &mi_schema005
          type:
          - string
          - 'null'
        runtime_active:
          type: boolean
          const: false
    ConnectorManifest:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - version
      - auth_fields
      - operations
      - input_schema
      - output_schema
      - required_scopes
      - verification_probe
      - timeout_ms
      - max_concurrent_probes
      properties:
        kind: &mi_schema007
          type: string
          enum:
          - plane
          - frappe
          - telegram
        name: *mi_schema001
        version:
          type: string
          const: '1'
        auth_fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - label
            - secret
            - required
            properties:
              name: *mi_schema001
              label: *mi_schema001
              secret:
                type: boolean
              required:
                type: boolean
        operations:
          type: array
          items: *mi_schema001
        input_schema:
          type: object
        output_schema:
          type: object
        required_scopes:
          type: array
          items: *mi_schema001
        verification_probe: *mi_schema001
        timeout_ms:
          type: integer
          const: 10000
        max_concurrent_probes:
          type: integer
          const: 1
    ConnectionVerifyInput:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - mode
      properties:
        expected_revision: *mi_schema002
        mode:
          type: string
          enum:
          - fixture
          - provider
    ConnectionLifecycleInput:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        expected_revision: *mi_schema002
        verification_id: *mi_schema003
    ChannelBindingSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - version
      - expires_at
      - revoked
      properties:
        id: &mi_schema004
          type: string
          format: uuid
        user_id: *mi_schema004
        version: *mi_schema002
        expires_at: &mi_schema006
          type: integer
          format: int64
        revoked:
          type: boolean
    ChannelOperationsSummary:
      type: object
      additionalProperties: false
      required:
      - mode
      - runtime_active
      - bindings
      properties:
        mode:
          type: string
          const: local_no_delivery
        runtime_active:
          type: boolean
          const: false
        bindings:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ChannelBindingSummary'
    BindingRevisionInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version: *mi_schema002
    ManagedExecutionInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version: *mi_schema002
        proposal_digest: *mi_schema005
        decision:
          type:
          - string
          - 'null'
          enum:
          - approve
          - reject
          - null
    ManagedExecutionSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - state
      - mode
      - proposal_digest
      - updated_at
      - timeline
      properties:
        id: *mi_schema004
        version: *mi_schema002
        state:
          type: string
          enum:
          - pending
          - running
          - cancel_requested
          - cancelled
          - completed
          - failed
          - uncertain
          - awaiting_review
        mode:
          type: string
          const: local_no_delivery
        proposal_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        updated_at: *mi_schema006
        timeline:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - version
            - state
            - at
            properties:
              version: *mi_schema002
              state: *mi_schema001
              at: *mi_schema006
    IntegrationEvaluationInput:
      type: object
      additionalProperties: false
      required:
      - suite_version
      properties:
        suite_version:
          type: string
          const: '1'
    IntegrationEvaluationResult:
      type: object
      additionalProperties: false
      required:
      - suite_version
      - mode
      - passed
      - total
      - quality_evaluated
      - cases
      properties:
        suite_version:
          type: string
        mode:
          type: string
          const: fixture
        passed:
          type: integer
        total:
          type: integer
          const: 24
        quality_evaluated:
          type: boolean
          const: false
        cases:
          type: array
          minItems: 24
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - kind
            - expected
            - actual
            - passed
            - evidence
            - question
            - fixture_version
            properties:
              id:
                type: string
              kind:
                type: string
              expected:
                type: string
              actual:
                type: string
              passed:
                type: boolean
              evidence:
                type: array
                items:
                  type: string
              question:
                type: string
              fixture_version:
                type: string
    AuthorizedMemoryPreference:
      type: object
      additionalProperties: false
      required:
      - consent
      - ttl_seconds
      properties:
        consent:
          type: boolean
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 604800
    AuthorizedMemorySummary:
      type: object
      additionalProperties: false
      required:
      - id
      - source_ref
      - expires_at
      properties:
        id: *mi_schema004
        source_ref: *mi_schema001
        expires_at: *mi_schema006
    PolicySimulationInput:
      type: object
      additionalProperties: false
      required:
      - operation
      - resource_reference
      properties:
        operation:
          type: string
          const: demo.resource.read
        resource_reference:
          type: string
          maxLength: 255
        subject_user_id: *mi_schema003
    PolicySimulationDecision:
      type: object
      additionalProperties: false
      required:
      - allowed
      - reason
      - simulation
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - allowed
          - not_authorized
        simulation:
          type: boolean
          const: true
    ManagedFixtureQueryInput:
      type: object
      additionalProperties: false
      required:
      - kind
      - version
      - operation
      - input
      - expected_revision
      properties:
        kind: *mi_schema007
        version:
          type: string
          const: '1'
        operation:
          type: string
          enum:
          - plane.resource.read
          - frappe.resource.read
          - telegram.context.read
        input:
          type: object
          additionalProperties: false
          required:
          - resource_ref
          properties:
            resource_ref:
              type: string
              minLength: 1
              maxLength: 255
        expected_revision: *mi_schema002
    ManagedFixtureQueryResult:
      type: object
      additionalProperties: false
      required:
      - mode
      - provider_active
      - result
      properties:
        mode:
          type: string
          const: fixture
        provider_active:
          type: boolean
          const: false
        result:
          type: object
          additionalProperties: false
          required:
          - resource_ref
          - evidence
          properties:
            resource_ref: *mi_schema001
            evidence:
              type: array
              items: *mi_schema001
    ManagedOperationError:
      type: object
      additionalProperties: false
      required:
      - code
      - correlation_id
      properties:
        code: *mi_schema001
        correlation_id: *mi_schema004
    IntegrationEvaluationCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - result
      properties:
        id: *mi_schema004
        result:
          $ref: '#/components/schemas/IntegrationEvaluationResult'
    ManagedExecutionProposal:
      type: object
      additionalProperties: false
      required: [id, version, proposal_digest, operation, resource_ref, destination, content]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        proposal_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        operation: {type: string, const: local.message.deliver}
        resource_ref: {type: string, format: uuid}
        destination: {type: string, description: Private destination visible only for authorized review}
        content: {type: string, description: Private exact content; never logged}
