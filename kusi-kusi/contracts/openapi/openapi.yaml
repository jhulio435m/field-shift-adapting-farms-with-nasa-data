  /v1/capabilities/execute:
    post:
      summary: Execute a permitted tenant capability using its registered connector
      description: |
        Tenant identity is resolved exclusively from the verified service key.
        An adapter protected by external_resource_policies additionally requires
        a live operator-verified identity link and a live exact resource grant
        bound to that credential, adapter, capability and version. For these
        adapters input is exactly {resource_ref: string}; no other fields are
        accepted. The registered output must be {resource_ref, data} with the
        same resource_ref. Missing/revoked/expired access returns 403; malformed
        scope or mismatched output returns 400; policy storage failure returns
        503. No external subject or tenant can be selected by input. This is
        manual provisioning, not live verification of provider permissions.
        Capabilities, exact permission grants and payload-free start/terminal audit
        events are persisted in PostgreSQL. Execution is blocked in local mode.
        In addition to configured generic HTTPS JSON connectors, explicitly
        provisioned server profiles support frappe_identity, plane_identity and
        wppconnect_health. Built-in reads accept only an empty input object and
        return normalized status without credentials, cookies or identity fields.
        URLs, hosts, credentials and profile selection cannot be supplied by the
        caller. WPPConnect health is not authenticated WhatsApp connectivity or
        message delivery. These adapters perform no business writes or sends.
      security: [{TenantBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier, version, input]
              properties:
                identifier: {type: string, maxLength: 120}
                version: {type: string, maxLength: 32}
                input: {description: "Validated against registered input_schema. Protected resource adapters require exactly resource_ref (nonempty string up to 255 UTF-8 bytes). Built-in identity/health reads require an empty object."}
      responses:
        '200':
          description: Structured connector result committed to audit before return
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [capability, version, source, data]
                properties:
                  capability: {type: string}
                  version: {type: string}
                  source: {type: string, const: configured_http_connector}
                  data: {description: "Registered output_schema. Protected resource adapters return an exact envelope with resource_ref matching the request and data. Built-in reads expose kind, reachable and authenticated, plus workspace_count for Plane."}
        '400': {description: Invalid input or connector output}
        '401': {description: Missing, invalid, expired or revoked tenant key}
        '403': {description: Local mode, disabled or unknown capability, permission or destination denied}
        '422': {description: Malformed execution envelope or unrecognized fields such as tenant ids or credentials}
        '503': {description: Connector, registry or audit unavailable; audit failure prevents successful return}
