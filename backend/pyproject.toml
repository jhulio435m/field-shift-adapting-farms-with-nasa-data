[project]
name = "field-shift-nasa"
version = "0.1.0"
description = "Climate Adaptation & Crop Rotation Decision-Support Engine using NASA Earth Observations (compatible with Kusi Kusi)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
